name: E2E (Maestro)

# UI automation against a real, isolated backend:
#   backend repo → docker compose E2E stack (gateway :3100) → deterministic seed → web build of this
#   app → Maestro (headless Chromium) → artifacts.
#
# - Pull requests run the smoke suite (critical customer path, ~4 min of flows).
# - A nightly schedule and manual runs execute everything: smoke + regression (failure paths,
#   authorization, offline recovery) + the business cycle across the customer, restaurant and driver
#   apps.
#
# Requires the backend branch in BACKEND_REF to contain docker-compose.e2e.yml and `npm run
# seed:e2e` (added alongside this workflow; see planning.md → E2E automation).
#
# Cross-app flows drive the real driver app (regression/order-awaiting-driver, business) and the real
# restaurant app (business). Both repos are public, so they are checked out without a token for
# every suite except smoke (PRs run smoke only).

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        options: [smoke, regression, business, all]
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'Delivery-Plus0/delivery-plus' }}
  BACKEND_REF: ${{ vars.BACKEND_REF || 'dev' }}
  MAESTRO_VERSION: 2.11.0
  E2E_API_URL: http://localhost:3100
  E2E_MANIFEST: ${{ github.workspace }}/backend/e2e-seed-manifest.json
  SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }}
  DRIVER_APP_REPOSITORY: ${{ vars.DRIVER_APP_REPOSITORY || 'Delivery-Plus0/delivery-plus-driver-app' }}
  DRIVER_APP_REF: ${{ vars.DRIVER_APP_REF || 'dev' }}
  DRIVER_APP_DIR: ${{ github.workspace }}/driver-app
  RESTAURANT_APP_REPOSITORY: ${{ vars.RESTAURANT_APP_REPOSITORY || 'Delivery-Plus0/delivery-plus-restaurant-app' }}
  RESTAURANT_APP_REF: ${{ vars.RESTAURANT_APP_REF || 'dev' }}
  RESTAURANT_APP_DIR: ${{ github.workspace }}/restaurant-app

jobs:
  maestro-web:
    name: Maestro web (${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out backend
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: backend

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Maestro needs Java 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start isolated E2E backend (fresh volumes)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run e2e:env:up

      - name: Seed deterministic E2E data
        working-directory: backend
        run: npm run seed:e2e
        env:
          API_URL: ${{ env.E2E_API_URL }}

      - name: Install app
        run: npm ci --no-audit --no-fund

      - name: Check out driver app (cross-app flows)
        if: env.SUITE != 'smoke'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DRIVER_APP_REPOSITORY }}
          ref: ${{ env.DRIVER_APP_REF }}
          path: driver-app

      - name: Check out restaurant app (cross-app flows)
        if: env.SUITE != 'smoke'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RESTAURANT_APP_REPOSITORY }}
          ref: ${{ env.RESTAURANT_APP_REF }}
          path: restaurant-app

      - name: Install driver and restaurant apps
        if: env.SUITE != 'smoke'
        run: |
          (cd driver-app && npm ci --no-audit --no-fund)
          (cd restaurant-app && npm ci --no-audit --no-fund)

      - name: Run Maestro suite (customer app + restaurant app + driver app)
        run: node e2e/scripts/run.mjs --suite "$SUITE" --build --headless

      - name: Collect backend logs
        if: failure()
        working-directory: backend
        run: |
          mkdir -p ../e2e/.artifacts/backend
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml ps > ../e2e/.artifacts/backend/compose-ps.txt || true
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml logs --no-color --tail=300 > ../e2e/.artifacts/backend/compose-logs.txt || true

      # JUnit reports always; screenshots/debug output are written for every flow and are most
      # useful on failure.
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ env.SUITE }}-${{ github.run_id }}
          path: e2e/.artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down E2E backend
        if: always()
        working-directory: backend
        run: npm run e2e:env:down
