url: ${APP_URL}
name: Arabic - the language switch shows the app in Arabic, remembers it across a reload, and switches back
tags:
  - regression
---
# E2E builds start in English (EXPO_PUBLIC_DEFAULT_LOCALE=en); real users default to Arabic (#151).
- runFlow: ../_shared/login.yaml
- openLink: ${APP_URL}/profile
- extendedWaitUntil:
    visible:
      id: language-switch
    timeout: 20000
- tapOn:
    id: language-ar
- extendedWaitUntil:
    visible: 'تسجيل الخروج'
    timeout: 15000
- assertVisible: 'اللغة'

# The choice is remembered: a reload opens in Arabic.
- openLink: ${APP_URL}/home
- extendedWaitUntil:
    visible:
      id: home-title
      text: 'نفسك في إيه؟'
    timeout: 20000
- assertVisible: 'الرئيسية'
- assertVisible: 'الطلبات'

# Back to English.
- openLink: ${APP_URL}/profile
- extendedWaitUntil:
    visible:
      id: language-en
    timeout: 20000
- tapOn:
    id: language-en
- extendedWaitUntil:
    visible: 'Sign out'
    timeout: 15000
- assertVisible: 'Language'
