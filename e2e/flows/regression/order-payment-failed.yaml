url: ${APP_URL}
name: Declined payment shows the order as Failed with no delivery
tags:
  - regression
---
- runFlow: ../_shared/login.yaml
# Seed scenario S2: payment forced to decline through the API (simulateFailure: true).
- openLink: ${APP_URL}/order/${FAILED_ORDER_ID}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Failed
    timeout: 20000
- assertVisible:
    id: order-phase
    text: Payment failed
- assertVisible: This order could not be completed and you were not charged\.
# No delivery, so no driver.
- assertNotVisible:
    id: driver-card
- assertNotVisible:
    id: order-cancel
