url: ${APP_URL}
name: Declined payment shows the order as Failed with no delivery
tags:
  - regression
---
- runFlow: ../_shared/login.yaml
# Seed scenario S2: payment forced to decline through the API (simulateFailure: true).
- openLink: ${APP_URL}/order/${FAILED_ORDER_ID}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Failed
    timeout: 20000
- assertVisible:
    id: order-phase
    text: Payment failed
- assertVisible: This order could not be completed and you were not charged\.
# No delivery, so no driver.
- assertNotVisible:
    id: driver-card
- assertNotVisible:
    id: order-cancel
# #143: the reason and payment line come from what the backend recorded for this order.
- assertVisible:
    id: order-outcome
    text: 'Your payment was declined, so the order was not placed\.'
- assertVisible:
    id: order-payment-status
    text: 'Payment declined · you were not charged'
# The Orders tab lists it under "Cancelled & failed", not under "Completed".
- openLink: ${APP_URL}/orders
- extendedWaitUntil:
    visible:
      id: orders-filter-cancelled
    timeout: 15000
- tapOn:
    id: orders-filter-cancelled
- extendedWaitUntil:
    visible:
      id: order-card-${FAILED_ORDER_ID}
    timeout: 15000
- tapOn:
    id: orders-filter-completed
- assertNotVisible:
    id: order-card-${FAILED_ORDER_ID}
