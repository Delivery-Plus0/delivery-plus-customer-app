url: ${APP_URL}
name: A ready order waits for a driver, then is assigned once one comes online
tags:
  - regression
---
- runFlow: ../_shared/login.yaml
# No driver free: the QA driver (the only driver in the E2E stack) goes offline, then an order is
# placed and marked ready through the API. Auto-dispatch creates the delivery, which waits.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/offline
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: scenario/order-ready
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Ready for pickup
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Finding a driver
    timeout: 20000
- assertVisible: '.*QA Pasta'
# The driver comes online; the auto-dispatch sweep (every 2s on the E2E stack) assigns the waiting
# delivery, and the app picks it up on its next poll.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/online
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Driver assigned
    timeout: 40000
# Leave the QA driver free for the business flow.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/pickup
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/start
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/complete
