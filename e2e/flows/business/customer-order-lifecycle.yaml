url: ${APP_URL}
name: Full cycle across all three apps - customer orders, the restaurant app readies it, automatic dispatch, the driver app delivers, customer sees Delivered
tags:
  - business
  - cross-app
---
# Three real UIs in one browser: the customer app (${APP_URL}), the restaurant app
# (${RESTAURANT_APP_URL}) and the driver app (${DRIVER_APP_URL}). No API stand-ins: dispatch is the
# backend's own automatic dispatch; nothing in this flow creates, prepares or assigns anything by API.

# CUSTOMER APP: sign in first (login.yaml starts from a clean browser state).
- runFlow: ../_shared/login.yaml

# DRIVER APP: the QA driver signs in and is offline, so the order below has to wait for them.
- runFlow: ../_shared/driver-app-sign-in.yaml
- runFlow: ../_shared/driver-app-go-offline.yaml

# CUSTOMER APP (real UI): browse, cart, checkout.
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible:
      id: home-title
    timeout: 20000
- runFlow: ../_shared/open-qa-kitchen.yaml
- tapOn:
    id: add-QA Burger
- extendedWaitUntil:
    visible:
      id: qty-QA Burger-value
    timeout: 15000
- tapOn:
    id: cart-bar
- extendedWaitUntil:
    visible:
      id: cart-checkout
    timeout: 15000
- tapOn:
    id: cart-checkout
- extendedWaitUntil:
    visible:
      id: checkout-place-order
    timeout: 15000
- tapOn:
    id: checkout-place-order
- extendedWaitUntil:
    visible:
      id: order-status
      text: Confirmed
    timeout: 20000

# Read-only: the id of the order just placed (so the other apps' cards can be addressed by it).
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: order/placed

# RESTAURANT APP (real UI): the new paid order is on the kitchen board; start preparing, then ready.
- runFlow: ../_shared/restaurant-app-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: order-${output.control.orderId}-start-preparing
    timeout: 30000
- assertVisible: '.*QA Burger'
- tapOn:
    id: order-${output.control.orderId}-start-preparing
- extendedWaitUntil:
    visible:
      id: order-${output.control.orderId}-status
      text: In kitchen
    timeout: 15000
- tapOn:
    id: order-${output.control.orderId}-ready-for-pickup
- extendedWaitUntil:
    visible:
      id: order-${output.control.orderId}-status
      text: Ready for pickup
    timeout: 15000

# AUTOMATIC DISPATCH: delivery-service consumed order.ready_for_pickup and created the delivery; with
# no driver online it waits.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-phase
      text: Finding a driver
    timeout: 30000
# The search is a first-class phase (#140): it says how long it has been looking, and no driver is shown yet.
- assertVisible:
    id: order-phase-note
    text: 'Searching for .*'
- assertNotVisible:
    id: driver-card
# Tracking says NO_DRIVER: the card says so and there is no map and no driver position (#132).
- extendedWaitUntil:
    visible:
      id: driver-location-status
      text: Finding a driver
    timeout: 20000
- assertNotVisible:
    id: tracking-map
- assertNotVisible:
    id: driver-marker

# DRIVER APP: going online is what gets the order assigned; the app finds the job through
# GET /deliveries/me/current and starts sharing its location.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: go-online
    timeout: 20000
- tapOn:
    id: go-online
- extendedWaitUntil:
    visible:
      id: current-delivery
    timeout: 30000
- assertVisible:
    id: driver-status
    text: On a delivery
- assertVisible:
    id: delivery-stage
    text: Go to the restaurant
- assertVisible: 'QA Kitchen'
- assertVisible: '1 Test Street, Apt 1'
- assertVisible: '.*QA Burger'
- extendedWaitUntil:
    visible:
      id: location-status
      text: Sharing your location with the customer
    timeout: 15000

# CUSTOMER APP: the driver is assigned. The runner checks the customer's tracking endpoint (customer
# token) returns the position the driver app sent as LIVE (#32); the order screen shows it Live on
# the map with the driver pin (#132). Maestro web can't inspect map tiles, so the flow asserts the
# map container, the pin and the status around it.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-phase
      text: Driver assigned
    timeout: 30000
# Who is coming (#140): the driver card shows the assigned driver's first name and vehicle, from the
# delivery read (customer-safe fields only).
- extendedWaitUntil:
    visible:
      id: driver-card-name
    timeout: 15000
- assertVisible:
    id: driver-card-vehicle
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: tracking/assert-location
- extendedWaitUntil:
    visible:
      id: driver-location-status
      text: Live
    timeout: 25000
- assertVisible:
    id: driver-location-detail
    text: 'Updated .*'
- assertVisible:
    id: tracking-map
- assertVisible:
    id: driver-marker
- assertVisible:
    id: driver-location-map

# REALTIME (#134): the order screen is subscribed to the tracking stream, so polling is off.
- extendedWaitUntil:
    visible:
      id: tracking-connection
      text: Live updates
    timeout: 15000
# Let the shown position age (the driver app isn't open, so nothing new is reported)…
- extendedWaitUntil:
    visible:
      id: driver-location-detail
      text: 'Updated [1-5][0-9] s ago'
    timeout: 30000
# …then the driver reports a new position through the real API. With polling off it can only reach
# the screen by push, and well inside one 10 s polling interval.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: tracking/move-driver
- extendedWaitUntil:
    visible:
      id: driver-location-detail
      text: Updated just now
    timeout: 5000
- assertVisible:
    id: driver-location-status
    text: Live

# CONNECTION INTERRUPTION: the gateway goes away. The stream drops and the polling fallback fails
# too, so the screen must stop calling the position Live and say it is reconnecting.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: gateway/stop
- extendedWaitUntil:
    visible:
      id: tracking-connection
      text: Reconnecting…
    timeout: 30000
- assertVisible:
    id: driver-location-status
    text: Last known location
- assertVisible:
    id: driver-marker
# The gateway is back: the client reconnects on its own (capped backoff) and realtime resumes.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: gateway/start
- extendedWaitUntil:
    visible:
      id: tracking-connection
      text: Live updates
    timeout: 60000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: tracking/move-driver
- extendedWaitUntil:
    visible:
      id: driver-location-detail
      text: Updated just now
    timeout: 5000
- assertVisible:
    id: driver-location-status
    text: Live

# DRIVER APP: picked up.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-pickup
    timeout: 20000
- tapOn:
    id: delivery-action-pickup
- tapOn:
    id: delivery-confirm-confirm
- extendedWaitUntil:
    visible:
      id: delivery-action-start
    timeout: 15000

# CUSTOMER APP: sees it.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-phase
      text: Picked up
    timeout: 30000

# DRIVER APP: on the way.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-start
    timeout: 20000
- tapOn:
    id: delivery-action-start
- tapOn:
    id: delivery-confirm-confirm
- extendedWaitUntil:
    visible:
      id: delivery-action-complete
    timeout: 15000

# CUSTOMER APP: sees it.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-phase
      text: On the way
    timeout: 30000

# DRIVER APP: delivered; the driver is free and online again.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-complete
    timeout: 20000
- tapOn:
    id: delivery-action-complete
- tapOn:
    id: delivery-confirm-confirm
- extendedWaitUntil:
    visible:
      id: waiting-for-job
    timeout: 20000
- assertVisible:
    id: driver-status
    text: 'Online · waiting for a job'

# CUSTOMER APP: order and delivery reach Delivered.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Delivered
    timeout: 30000
- assertVisible:
    id: order-phase
    text: Delivered
# Tracking ended with the delivery (ENDED): no card, no map, no driver position any more.
- assertNotVisible:
    id: driver-location
- assertNotVisible:
    id: tracking-map
- assertNotVisible:
    id: driver-marker

# RATING (#144): after delivery the customer rates the driver once; the screen then shows the stored rating.
- extendedWaitUntil:
    visible:
      id: rating-card
    timeout: 20000
- assertVisible: 'How was your delivery with .*\?'
- tapOn:
    id: rating-star-5
- assertVisible:
    id: rating-score-label
    text: '5 stars · Excellent'
- tapOn:
    id: rating-comment
- inputText: Quick and careful
- tapOn:
    id: rating-submit
- extendedWaitUntil:
    visible:
      id: rating-done
    timeout: 15000
- assertVisible:
    id: rating-done-stars
    text: '★★★★★'
- assertVisible: '.*Quick and careful.*'
- assertNotVisible:
    id: rating-card

# Server-side checks for this order: DELIVERED, exactly one delivery row, no new dead letters.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: verify/order-integrity

# CUSTOMER APP: Alerts has a notification for every stage of this order (#5): payment received, order
# confirmed, driver assigned, picked up, delivered.
- openLink: ${APP_URL}/notifications
- extendedWaitUntil:
    visible: '.*${output.control.orderId} has been delivered\..*'
    timeout: 20000
- assertVisible: '.*${output.control.orderId} has been picked up and is on its way\.'
- assertVisible: '.*on the way to pick up your order ${output.control.orderId}\.'
- assertVisible: '.*${output.control.orderId} has been confirmed\.'
- assertVisible: '.*received your payment for order ${output.control.orderId}\.'
