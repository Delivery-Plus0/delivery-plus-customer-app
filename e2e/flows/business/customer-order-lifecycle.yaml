url: ${APP_URL}
name: Full cycle - customer orders, restaurant prepares, driver delivers, customer sees Delivered
tags:
  - business
---
# CUSTOMER APP (real UI): browse, cart, checkout.
- runFlow: ../_shared/login.yaml
- runFlow: ../_shared/open-qa-kitchen.yaml
- tapOn:
    id: add-QA Burger
- extendedWaitUntil:
    visible:
      id: qty-QA Burger-value
    timeout: 15000
- tapOn:
    id: cart-bar
- extendedWaitUntil:
    visible:
      id: cart-checkout
    timeout: 15000
- tapOn:
    id: cart-checkout
- extendedWaitUntil:
    visible:
      id: checkout-place-order
    timeout: 15000
- tapOn:
    id: checkout-place-order
- extendedWaitUntil:
    visible:
      id: order-status
      text: Confirmed
    timeout: 20000

# RESTAURANT (stand-in: no restaurant client exists yet, so the runner acts as
# qa.restaurant through the real API).
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: restaurant/prepare
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: restaurant/ready

# DISPATCH is automatic: delivery-service consumes order.ready_for_pickup and assigns the QA driver
# within about a second, so the app (polling every 10s) goes straight to "Driver assigned". The
# "Finding a driver" state is covered by regression/order-awaiting-driver.yaml.
# DRIVER: stand-in (no driver client exists yet); it finds its job via GET /deliveries/me/current.
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Driver assigned
    timeout: 30000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/pickup
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Picked up
    timeout: 30000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/start
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: On the way
    timeout: 30000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: driver/complete

# CUSTOMER APP: order and delivery reach Delivered; the confirmation notification is in Alerts.
- extendedWaitUntil:
    visible:
      id: order-status
      text: Delivered
    timeout: 30000
- assertVisible:
    id: delivery-stage
    text: Delivered
- openLink: ${APP_URL}/notifications
- extendedWaitUntil:
    visible: '.*${output.control.orderId} has been confirmed\.'
    timeout: 20000
